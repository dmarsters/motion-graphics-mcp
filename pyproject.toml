[project]
name = "motion-graphics-mcp"
version = "2.0.0"
description = "Three.js motion graphics aesthetic enhancement with code generation, post-processing, scene graph composition, and Orbit Composer integration"
requires-python = ">=3.10"
dependencies = ["fastmcp", "pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
motion-graphics-mcp = "motion_graphics_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
