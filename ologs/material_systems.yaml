# Material Systems Taxonomy
# Layer 1 - Pure taxonomy (zero LLM cost)

basic_materials:
  metallic:
    name: "Metallic"
    description: "Reflective metal surface"
    threejs_material: "MeshStandardMaterial"
    parameters:
      metalness: 1.0
      roughness: 0.2
      color: "#C0C0C0"
    visual_character: "reflective, conductive, industrial"
    lighting_response: "strong specular highlights, environment reflections"
    
  glass:
    name: "Glass"
    description: "Transparent refractive material"
    threejs_material: "MeshPhysicalMaterial"
    parameters:
      metalness: 0.0
      roughness: 0.0
      transmission: 0.9
      thickness: 0.5
      ior: 1.5  # index of refraction
    visual_character: "transparent, refractive, crystalline"
    lighting_response: "refraction, caustics, transparency"
    
  neon:
    name: "Neon"
    description: "Glowing emissive material"
    threejs_material: "MeshStandardMaterial"
    parameters:
      emissive: "#00FFFF"
      emissiveIntensity: 2.0
      color: "#00FFFF"
      metalness: 0.0
      roughness: 0.8
    visual_character: "glowing, electric, cyberpunk"
    lighting_response: "self-illuminated, bloom-eligible"
    
  matte:
    name: "Matte"
    description: "Non-reflective diffuse surface"
    threejs_material: "MeshStandardMaterial"
    parameters:
      metalness: 0.0
      roughness: 1.0
      color: "#808080"
    visual_character: "flat, absorptive, minimal"
    lighting_response: "pure diffuse, no specular"
    
  holographic:
    name: "Holographic"
    description: "Iridescent rainbow shimmer"
    threejs_material: "MeshPhysicalMaterial"
    parameters:
      metalness: 0.3
      roughness: 0.1
      iridescence: 1.0
      iridescenceIOR: 1.3
      color: "#FFFFFF"
    visual_character: "rainbow, prismatic, futuristic"
    lighting_response: "angle-dependent color shift"

physically_based:
  subsurface_scattering:
    name: "Subsurface Scattering"
    description: "Light penetrates and scatters within material (wax, skin, marble)"
    threejs_material: "MeshPhysicalMaterial"
    parameters:
      metalness: 0.0
      roughness: 0.4
      transmission: 0.5
      thickness: 2.0
      attenuationDistance: 0.5
      attenuationColor: "#FFCCCC"
    visual_character: "soft, organic, translucent glow"
    lighting_response: "backlit glow, internal scattering"
    use_cases: ["skin", "wax", "marble", "jade", "milk"]
    
  anisotropic_metal:
    name: "Anisotropic Metal"
    description: "Directional reflectance (brushed aluminum, hair)"
    threejs_material: "MeshPhysicalMaterial"
    parameters:
      metalness: 1.0
      roughness: 0.3
      anisotropy: 0.9
      anisotropyRotation: 0.0  # radians
      color: "#B8B8B8"
    visual_character: "brushed, directional, technical"
    lighting_response: "elongated specular highlights along grain direction"
    use_cases: ["brushed_aluminum", "hair", "brushed_steel", "vinyl_records"]
    
  volumetric:
    name: "Volumetric"
    description: "Participates in volume (fog, clouds, smoke)"
    custom_material: "volumetric_shader"
    parameters:
      density: 0.5
      absorption: 0.3
      scattering: 0.7
      color: "#FFFFFF"
      step_size: 0.1
    visual_character: "atmospheric, ethereal, spatial depth"
    lighting_response: "light scattering, god rays, atmospheric perspective"
    use_cases: ["fog", "clouds", "smoke", "underwater", "dust"]
    
  frosted_glass:
    name: "Frosted Glass"
    description: "Diffuse transmission (privacy glass, etched surface)"
    threejs_material: "MeshPhysicalMaterial"
    parameters:
      metalness: 0.0
      roughness: 0.5
      transmission: 0.8
      thickness: 0.5
      ior: 1.5
      clearcoat: 0.3
    visual_character: "diffused, private, elegant"
    lighting_response: "scattered transmission, soft shadows"
    use_cases: ["privacy_glass", "frosted_bottle", "etched_surface"]

technical_debug:
  wireframe:
    name: "Wireframe"
    description: "Mesh edges visible, faces transparent or colored"
    threejs_material: "MeshBasicMaterial"
    parameters:
      wireframe: true
      color: "#00FF00"
      opacity: 1.0
    visual_character: "technical, skeletal, mesh structure revealed"
    lighting_response: "unlit (no lighting calculation)"
    use_cases: ["debug", "technical_visualization", "blueprint_aesthetic"]
    
  x_ray:
    name: "X-Ray"
    description: "Transparent with glowing edges"
    custom_material: "x_ray_shader"
    parameters:
      alpha: 0.2
      edge_intensity: 2.0
      edge_color: "#00FFFF"
      fresnel_power: 2.0
    visual_character: "transparent, diagnostic, medical"
    lighting_response: "fresnel-based edge glow"
    use_cases: ["medical_viz", "technical_analysis", "ghost_effect"]
    
  normal_map_viz:
    name: "Normal Map Visualization"
    description: "Surface normals displayed as RGB colors"
    threejs_material: "MeshNormalMaterial"
    parameters:
      flatShading: false
    visual_character: "rainbow gradients, technical analysis"
    lighting_response: "unlit (normals mapped to RGB)"
    use_cases: ["debug", "technical_art", "topology_analysis"]
    
  depth_map:
    name: "Depth Map"
    description: "Grayscale by distance from camera"
    threejs_material: "MeshDepthMaterial"
    parameters:
      depthPacking: "BasicDepthPacking"
    visual_character: "grayscale gradient, spatial depth"
    lighting_response: "unlit (depth mapped to brightness)"
    use_cases: ["depth_of_field", "spatial_analysis", "fog_calculation"]

stylized:
  cel_shaded:
    name: "Cel Shaded"
    description: "Cartoon toon shader with discrete shading bands"
    custom_material: "toon_shader"
    parameters:
      color: "#FF6B6B"
      shading_levels: 3  # number of discrete bands
      outline_width: 0.02
      outline_color: "#000000"
    visual_character: "cartoon, graphic, animation-style"
    lighting_response: "quantized lighting, hard shadow transitions"
    use_cases: ["cartoon", "anime", "graphic_novels", "stylized_games"]
    
  matcap:
    name: "MatCap (Material Capture)"
    description: "Environment probe baked into texture"
    threejs_material: "MeshMatcapMaterial"
    parameters:
      matcap_texture: "matcap_chrome.jpg"  # reference image
      color: "#FFFFFF"
    visual_character: "painted lighting, no realtime calculation"
    lighting_response: "pre-baked, consistent appearance"
    use_cases: ["sculpting_preview", "consistent_look", "low_overhead"]
    
  gradient_mapped:
    name: "Gradient Mapped"
    description: "Remap colors by height/position/parameter"
    custom_material: "gradient_shader"
    parameters:
      gradient_axis: "y"  # x, y, z
      color_stops: ["#FF0000", "#FFFF00", "#00FF00", "#00FFFF", "#0000FF"]
      range_min: -1.0
      range_max: 1.0
    visual_character: "data visualization, topographic"
    lighting_response: "color overrides lighting"
    use_cases: ["heatmaps", "elevation", "data_viz"]
    
  chromatic_aberration:
    name: "Chromatic Aberration"
    description: "RGB channels offset for lens distortion effect"
    custom_material: "chromatic_shader"
    parameters:
      offset_amount: 0.005
      direction: "radial"  # radial or lateral
    visual_character: "glitchy, analog lens artifact"
    lighting_response: "post-process effect on color channels"
    use_cases: ["vhs_aesthetic", "glitch_art", "analog_imperfection"]

dynamic:
  iridescent:
    name: "Iridescent"
    description: "Oil slick, soap bubble rainbow effect"
    threejs_material: "MeshPhysicalMaterial"
    parameters:
      metalness: 0.0
      roughness: 0.1
      iridescence: 1.0
      iridescenceIOR: 1.8
      iridescenceThicknessRange: [100, 800]  # nanometers
      color: "#FFFFFF"
    visual_character: "rainbow shimmer, organic, insect wing"
    lighting_response: "thin-film interference, angle-dependent"
    use_cases: ["soap_bubbles", "oil_slicks", "beetle_shells", "opals"]
    
  color_shifting:
    name: "Color Shifting"
    description: "Hue rotation over time"
    custom_material: "color_shift_shader"
    parameters:
      base_color: "#FF00FF"
      shift_speed: 1.0  # cycles per second
      shift_range: 360.0  # degrees
    visual_character: "dynamic, psychedelic, temporal"
    lighting_response: "color animates independently of lighting"
    use_cases: ["music_visualization", "psychedelic", "mood_lighting"]
    
  reactive_audio:
    name: "Reactive Audio"
    description: "Material properties respond to audio amplitude/frequency"
    custom_material: "audio_reactive_shader"
    parameters:
      reactive_property: "emissiveIntensity"  # or roughness, metalness, etc
      frequency_band: "bass"  # bass, mid, treble
      response_scale: 2.0
      smoothing: 0.8
    visual_character: "musical, responsive, alive"
    lighting_response: "synchronized to sound"
    use_cases: ["music_visualizer", "VJ_tool", "audio_reactive_art"]
    
  energy_field:
    name: "Energy Field"
    description: "Pulsing glow, force field effect"
    custom_material: "energy_field_shader"
    parameters:
      base_color: "#00FFFF"
      pulse_speed: 2.0
      pulse_intensity: 1.5
      fresnel_power: 3.0
      scan_lines: true
    visual_character: "sci-fi, protective barrier, alien tech"
    lighting_response: "self-illuminated with pulsing animation"
    use_cases: ["force_fields", "shields", "energy_barriers", "portals"]

effects:
  particle_system:
    name: "Particle System"
    description: "Point cloud material for particle effects"
    threejs_material: "PointsMaterial"
    parameters:
      size: 0.05
      sizeAttenuation: true
      color: "#FFFFFF"
      transparent: true
      opacity: 0.8
    visual_character: "pointillist, swarm, dust motes"
    lighting_response: "unlit points, billboard sprites"
    use_cases: ["dust", "stars", "fireflies", "snow", "sparks"]
    
  trail_material:
    name: "Trail Material"
    description: "Motion blur/streak effect for trails"
    custom_material: "trail_shader"
    parameters:
      color: "#FFFFFF"
      opacity_falloff: 0.9
      width: 0.1
      segments: 20
    visual_character: "speed lines, comet tail, motion"
    lighting_response: "additive blending, glowing trails"
    use_cases: ["speed_lines", "comet_trails", "lightsaber", "magic_spells"]
    
  fresnel_glow:
    name: "Fresnel Glow"
    description: "Edge highlighting based on view angle"
    custom_material: "fresnel_shader"
    parameters:
      rim_color: "#00FFFF"
      rim_power: 3.0
      base_color: "#1A1A1A"
      intensity: 2.0
    visual_character: "backlit rim, halo, contour emphasis"
    lighting_response: "view-angle dependent glow"
    use_cases: ["atmospheric_glow", "outline_effect", "ethereal"]

intentionality: |
  Materials define surface appearance and light interaction.
  
  **Physical Accuracy vs Stylization:**
  - PBR materials (metallic, glass, SSS) = photorealistic, predictable
  - Stylized materials (cel-shaded, matcap) = artistic control, performance
  - Debug materials (wireframe, normals) = technical understanding
  - Effects materials (trails, particles) = motion and energy
  
  **Three.js Material System:**
  - MeshStandardMaterial: PBR workflow, good all-rounder
  - MeshPhysicalMaterial: Extended PBR (transmission, iridescence, anisotropy)
  - Custom shaders: GLSL for unique effects beyond built-in capabilities
  
  **Performance Hierarchy:**
  - Unlit (Basic, Normal, Depth) = cheapest, no lighting
  - Standard = moderate, PBR lighting
  - Physical = expensive, advanced PBR features
  - Custom shaders = variable, depends on complexity
  
  **Lighting Response:**
  Materials are chosen based on desired interaction with scene lighting.
  Emissive materials add light to scene. Transmissive materials require
  extra rendering passes. Volumetric materials need ray marching.
  
  **Selection Criteria:**
  Match material to subject (metal for robot, glass for crystal),
  aesthetic (realistic vs stylized), and performance budget.
