# =============================================================================
# Text Primitives Olog — Semantic Motion Graphics Taxonomy
# =============================================================================
#
# Extension to Motion Graphics MCP: OBJECT dimension
#
# Key insight: Emoji are PRE-COMPOSED MORPHISMS. Unlike geometric primitives
# which acquire meaning through LOOK + ACTION + EFFECT, emoji arrive with
# semantic content that implies defaults across ALL four OLAE dimensions.
#
# The semantic_profile on each glyph is a complete default OLAE specification.
# Users override selectively — the inference engine fills everything else.
#
# Rendering modes:
#   billboard    — CanvasTexture on PlaneGeometry, always faces camera
#   extruded     — 3D letterform with depth, full material/lighting interaction
#   sdf          — Signed Distance Field, resolution-independent at any scale
#   particle     — Instanced billboards for swarm/field compositions
#
# Compositional roles:
#   anchor       — Scene center of gravity, others orbit/reference it
#   satellite    — Orbits or references an anchor
#   particle     — Swarm member, instanced, staggered timing
#   background   — Ambient fill, slow drift, low opacity
#   trigger      — Event-driven appearance (flash, snap, burst)
#
# Physics models:
#   rigid        — Solid body, clean rotation/translation
#   fluid        — Wave propagation, flow fields
#   particle     — Emission, drift, fade lifecycle
#   elastic      — Snap, bounce, spring dynamics
#   growth       — Scale emergence, unfold, bloom
#   orbital      — Keplerian motion, gravity wells
#
# =============================================================================

intentionality: >
  Text primitives extend the OBJECT dimension with semantically pre-loaded
  forms. Where geometric primitives are meaning-neutral vessels shaped by
  LOOK + ACTION + EFFECT, text primitives carry inherent semantic content
  that implies natural defaults across all four OLAE dimensions. The
  semantic inference layer is a Layer 2 deterministic system: given a glyph,
  it returns a complete default OLAE configuration with zero LLM cost.
  Users override selectively — the system fills gaps with semantically
  coherent defaults. This inverts the usual composition direction: instead
  of building meaning additively, you modulate meaning that already exists.


# =============================================================================
# RENDERING CONFIGURATION
# =============================================================================

render_modes:
  billboard:
    name: "Billboard Sprite"
    description: "Emoji rendered to CanvasTexture on PlaneGeometry, always faces camera"
    threejs_geometry: "PlaneGeometry"
    texture_source: "canvas_2d"
    parameters:
      canvas_resolution: 512
      font_size_ratio: 0.78      # fraction of canvas size
      font_family: "serif"       # best emoji rendering cross-platform
      transparent: true
      alpha_test: 0.01
    face_camera: true
    supports_instancing: true
    material_interaction: "limited"  # color tint only, no metalness/roughness
    complexity: "low"
    use_cases:
      - "particle swarms"
      - "rapid prototyping"
      - "always-readable icons"
      - "HUD / overlay elements"

  extruded:
    name: "Extruded Glyph"
    description: "3D letterform with depth — full material and lighting interaction"
    threejs_geometry: "ExtrudeGeometry"
    texture_source: "shape_path"
    parameters:
      depth: 0.3
      bevel_enabled: true
      bevel_thickness: 0.02
      bevel_size: 0.015
      bevel_segments: 4
      curve_segments: 24
    face_camera: false
    supports_instancing: false
    material_interaction: "full"    # metalness, roughness, clearcoat all apply
    complexity: "high"
    use_cases:
      - "hero text / titles"
      - "architectural typography"
      - "material showcase"
      - "physical interaction scenes"

  sdf:
    name: "SDF Text"
    description: "Signed Distance Field rendering — crisp at any scale"
    threejs_geometry: "PlaneGeometry"
    texture_source: "sdf_texture"
    parameters:
      sdf_resolution: 256
      padding: 0.25
      smoothing: 0.1
      outline_width: 0.0
      outline_color: "#000000"
    face_camera: true
    supports_instancing: true
    material_interaction: "shader"  # custom SDF shader, color + outline
    complexity: "medium"
    use_cases:
      - "text at variable distances"
      - "zoom transitions"
      - "clean UI elements"
      - "resolution-independent labels"

  particle:
    name: "Instanced Particle"
    description: "InstancedMesh of billboard glyphs for swarm compositions"
    threejs_geometry: "PlaneGeometry"
    texture_source: "canvas_2d"
    parameters:
      canvas_resolution: 256       # lower res OK for small instances
      max_instances: 500
      instance_scale_variance: 0.3
      instance_opacity_variance: 0.2
    face_camera: true
    supports_instancing: true
    material_interaction: "limited"
    complexity: "medium"
    use_cases:
      - "snow, rain, confetti"
      - "emoji storms"
      - "field visualizations"
      - "ambient atmosphere"


# =============================================================================
# SEMANTIC GLYPH CATEGORIES
# =============================================================================
#
# Each category groups glyphs sharing physics models and compositional behavior.
# Individual glyph entries override category defaults where needed.
#

natural_phenomena:
  fire:
    glyph: "🔥"
    name: "Fire"
    description: "Flickering upward combustion — implies particle emission and warm palette"
    render_mode: "billboard"
    semantic_profile:
      implied_object:
        primitive: "emoji_glyph"
        render_mode: "billboard"
      implied_look:
        material: "emissive"
        color_mode: "glyph_native"
        fallback_palette: "sunset"
      implied_action:
        motion: "oscillate"
        parameters:
          speed: 2.5
          amplitude: 0.15
          axis: "y"
        secondary_motion: "scale_pulse"
        secondary_parameters:
          speed: 3.0
          amplitude: 0.08
      implied_effects: ["bloom"]
      effect_intensities:
        bloom: 0.7
      physics_model: "particle"
      compositional_role: "trigger"
      semantic_tags: ["hot", "destructive", "energetic", "upward"]
      implied_scene_behavior:
        particle_emission: true
        emission_rate: 8
        emission_direction: [0, 1, 0]
        lifetime: 1.5
        fade_out: true

