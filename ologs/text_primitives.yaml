# =============================================================================
# COMPOSITIONAL ROLE COMPATIBILITY MATRIX
# =============================================================================
# Defines which role combinations create coherent scenes.
# Used by compose_emoji_scene() for automatic layout.

role_compatibility:
  anchor:
    max_per_scene: 2
    default_position: [0, 0, 0]
    default_scale: 1.5
    description: "Scene center of gravity"

  satellite:
    max_per_scene: 6
    default_relationship: "orbit_around"
    default_target: "nearest_anchor"
    orbit_radius_range: [2.0, 5.0]
    description: "Orbits or references an anchor"

  particle:
    max_per_scene: 100
    default_relationship: "cascade_delay"
    arrangement: "radial"
    instance_count_range: [8, 50]
    description: "Swarm member with staggered timing"

  background:
    max_per_scene: 4
    default_position_z: -5.0
    default_scale: 2.0
    default_opacity: 0.5
    description: "Ambient fill, slow drift"

  trigger:
    max_per_scene: 3
    default_visibility: "hidden"
    activation: "timed"
    description: "Event-driven appearance"


